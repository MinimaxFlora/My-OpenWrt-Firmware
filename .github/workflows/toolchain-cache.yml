name: Build Toolchain Cache

on:
  workflow_dispatch:
  repository_dispatch:
    types: [toolchain-cache]

# 同一时间只允许一个缓存生成任务，新触发的排队等待
concurrency:
  group: toolchain-cache
  cancel-in-progress: false

jobs:
  toolchain-cache:
    name: 🧰 编译并上传工具链缓存
    runs-on: ubuntu-24.04

    # 仅允许仓库所有者触发
    if: ${{ github.event.repository.owner.id == github.event.sender.id }}

    timeout-minutes: 360

    defaults:
      run:
        shell: bash

    permissions:
      contents: write

    steps:
      # ==========================================================
      # 检出代码 (.config / files / patches)
      # ==========================================================
      - name: 📥 检出代码
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # ==========================================================
      # 可用磁盘空间 (与 build-release.yml 保持一致，保证工具链编译+压缩空间充足)
      # ==========================================================
      - name: 🧹 可用磁盘空间
        run: |
          echo "::group::🧹 清理交换空间"

          sudo mkdir -p /home/runner/work/My-OpenWrt-Firmware/My-OpenWrt-Firmware

          sudo find /opt -mindepth 1 -maxdepth 1 ! -name "*runner*" -exec rm -rf {} \;

          sudo rm -rf \
            /usr/local/lib/android \
            /usr/lib/google-cloud-sdk \
            /usr/lib/jvm \
            /usr/lib/{clang-16,clang-17,llvm-16,llvm-17} \
            /usr/local/aws* \
            /usr/local/julia* \
            /usr/local/share/{chromium,powershell,vcpkg} \
            /usr/share/dotnet \
            /usr/share/swift

          sudo swapoff -a
          sudo rm -f /swapfile

          echo "::endgroup::"

          echo "::group::💽 创建交换"

          sudo dd if=/dev/zero of="/mnt/swapfile" bs=1G count=4
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

          echo "::endgroup::"

          root_dev=$(df / | awk 'NR==2 {print $1}')
          mnt_dev=$(df /mnt | awk 'NR==2 {print $1}')

          if [[ "$root_dev" != "$mnt_dev" ]]; then
            echo "::group::🧱 创建卷组"

            mnt_size=$(expr $(df -h /mnt | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//') - 4)
            root_size=$(expr $(df -h / | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//') - 2)

            sudo truncate -s "$mnt_size"G /mnt/mnt.img
            sudo truncate -s "$root_size"G /root.img

            sudo losetup /dev/loop6 /mnt/mnt.img
            sudo losetup /dev/loop7 /root.img

            sudo pvcreate /dev/loop6
            sudo pvcreate /dev/loop7

            sudo vgcreate github /dev/loop6 /dev/loop7
            sudo lvcreate -n runner -l 100%FREE github

            sudo mkfs.xfs /dev/mapper/github-runner

            sudo mount \
              /dev/mapper/github-runner \
              /home/runner/work/My-OpenWrt-Firmware/My-OpenWrt-Firmware

            echo "::endgroup::"
          fi

          sudo chown -R runner:runner \
            /home/runner/work/My-OpenWrt-Firmware/My-OpenWrt-Firmware

          sudo sysctl -w vm.drop_caches=3

      # ==========================================================
      # 配置构建系统环境 (编译工具链所需的最小依赖集)
      # ==========================================================
      - name: 🛠️ 配置构建系统环境
        run: |
          echo "::group::📦 安装 OpenWrt 编译依赖"

          sudo rm -rf /etc/apt/sources.list.d

          sudo bash -c \
            "curl -skL https://raw.githubusercontent.com/sbwml/actions/openwrt-build-setup/sources-24.04.list > /etc/apt/sources.list"

          sudo apt-get update

          sudo apt-get install -y \
            autoconf automake binutils bison build-essential \
            bzip2 ccache cmake coreutils curl file flex g++ \
            g++-multilib gawk gcc-multilib gettext git \
            gperf jq libncurses5-dev libssl-dev libtool \
            patch python3 python3-ply rsync texinfo \
            unzip upx-ucl wget zlib1g-dev zstd

          echo "::endgroup::"

          sudo apt-get clean

      # ==========================================================
      # 克隆 OpenWrt 源码 (与 build-release.yml 相同分支/镜像替换)
      # ==========================================================
      - name: ⬇️ 克隆 OpenWrt 源码
        run: |
          git clone \
            --depth=1 \
            -b openwrt-25.12 \
            https://github.com/openwrt/openwrt.git

          sed -i \
            's|https://git.openwrt.org/feed/|https://github.com/openwrt/|g' \
            openwrt/feeds.conf.default

          sed -i \
            's|https://git.openwrt.org/project/|https://github.com/openwrt/|g' \
            openwrt/feeds.conf.default

      # ==========================================================
      # 加载自定义配置 (工具链版本/架构/libc 均由此决定)
      # ==========================================================
      - name: ⚙️ 加载自定义配置
        working-directory: ./openwrt
        run: |
          cp "$GITHUB_WORKSPACE/.config" .config
          cp -rf "$GITHUB_WORKSPACE/files" ./
          find ./files -type d -exec chmod +x {} \; 2>/dev/null || true
          make defconfig

      # ==========================================================
      # 编译工具链并打包 (build_dir/dl/staging_dir/tmp)
      # ==========================================================
      - name: 🔨 编译工具链并打包
        working-directory: ./openwrt
        run: |
          # 缓存文件名与 build-release.yml 的「🗃️ 下载工具链缓存」步骤保持一致
          # 仅支持 x86_64 + musl + GCC 15; 若调整 .config 的 libc/gcc 版本须同步修改此处
          TOOLCHAIN_FILE="toolchain_musl_x86_64_gcc-15.tar.zst"
          echo "TOOLCHAIN_FILE=${TOOLCHAIN_FILE}" >> "$GITHUB_ENV"
          echo -e "\n\e[1;36m================================================================\e[0m"
          echo -e "\e[1;33m   🔨 生成工具链缓存: ${TOOLCHAIN_FILE} \e[0m"
          echo -e "\e[1;36m================================================================\e[0m"

          # 编译工具链 (host tools + 交叉编译器 + C 库)，失败时以 V=s 重试便于定位
          echo -e "\n\e[1;32m[🔨] Building Toolchain ...\e[0m"
          make -j"$(nproc)" toolchain/compile || make -j1 toolchain/compile V=s || exit 1

          # 打包 ./{build_dir,dl,staging_dir,tmp} → zstd 压缩
          mkdir -p toolchain-cache
          echo -e "\n\e[1;32m[🗜️] 正在压缩工具链缓存 (zstd -19 -T$(nproc))，请耐心等待...\e[0m"
          tar -I "zstd -19 -T$(nproc)" \
            -cf "toolchain-cache/${TOOLCHAIN_FILE}" \
            ./{build_dir,dl,staging_dir,tmp} || exit 1

          sha256sum "toolchain-cache/${TOOLCHAIN_FILE}" | tee "toolchain-cache/${TOOLCHAIN_FILE}.sha256"
          ls -lh toolchain-cache/

          echo -e "\n\e[1;32m[✅] Build success! 缓存已就绪，等待上传 Release\e[0m"

      # ==========================================================
      # 上传到 Release (滚动 Tag: Toolchain_Cache)
      # ==========================================================
      - name: 🚀 上传缓存到 Release (Toolchain_Cache)
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: Toolchain_Cache
          name: 🧰 OpenWrt Toolchain Cache (openwrt-25.12)
          body: |
            ### 🧰 OpenWrt 25.12 工具链缓存 (Toolchain_Cache)

            - 由 `Build Toolchain Cache` 工作流手动触发生成，滚动更新（重新运行即覆盖同名缓存包）。
            - 打包内容：`build_dir/ dl/ staging_dir/ tmp/`
            - 配套 `build-release.yml` 中的「🗃️ 下载工具链缓存」步骤使用：
              每次编译前直接从此 Release 下载并解压，跳过工具链编译阶段，
              不再依赖 GitHub Actions 缓存 (cachewrtbuild)，上游源码更新也不会导致工具链重新编译。
            - 仅当 **GCC 版本 / libc / 目标架构** 配置变化时，才需要重新运行本工作流生成新缓存。

            ### 📄 缓存文件命名规则

            `toolchain_<libc>_<arch>_gcc-<version>.tar.zst`，例如：`toolchain_musl_x86_64_gcc-15.tar.zst`
          files: |
            ./openwrt/toolchain-cache/*.tar.zst
            ./openwrt/toolchain-cache/*.sha256
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
