name: Build Releases

on:
  # 允许在 GitHub 仓库的 Actions 页面手动触发此工作流（会显示一个 "Run workflow" 按钮）
  workflow_dispatch:
  
  # 允许通过外部 API 请求（Repository Dispatch 事件）来触发此工作流
  repository_dispatch:
    # 限制只有当接收到的事件类型（event type）为 upstream-update 时，才会触发该工作流
    types: [upstream-update]

jobs:
  # 定义工作流中的任务列表，这里定义了一个名为 "build" 的任务
  build:
    # 指定该任务运行所在的虚拟机操作系统环境为 Ubuntu 24.04
    runs-on: ubuntu-24.04
    
    # 条件判断：仅当仓库所有者（owner）的 ID 与触发此事件的发送者（sender）ID 相同时，才执行此任务
    # （常用于安全控制，确保只有仓库所有者自己或受信任的账号能触发特定操作）
    if: ${{ github.event.repository.owner.id == github.event.sender.id }}
    
    # 设置任务的最大运行超时时间为 360 分钟（6小时），超时后会自动终止
    timeout-minutes: 360
    
    # 设置此任务中所有运行步骤（run）的默认属性
    defaults:
      run:
        # 指定默认使用的命令行脚本解释器为 Bash
        shell: bash
        
    # 设置该任务在运行期间对 GitHub 仓库内置令牌（GITHUB_TOKEN）的权限控制
    permissions:
      # 对仓库代码内容授予“只读”权限
      contents: read
      # 对 GitHub Actions 相关信息授予“只读”权限
      actions: read
      
    # 定义该任务中需要依次执行的具体步骤（Steps）列表
    steps:
      - name: 📥 检出代码
        # 使用 GitHub 官方提供的 checkout 动作（v7.0.1 版本）
        # 其主要作用是将当前仓库的代码下载到运行器（Runner）的工作目录中
        uses: actions/checkout@v7.0.1
        # 传递给该动作的配置参数（输入项）
        with:
          # 设置为 false，表示不将凭据（如 GITHUB_TOKEN）持久化保存在本地 Git 仓库配置中
          # 出于安全最佳实践，如果后续步骤不需要向仓库推送（git push）代码，建议关闭以防凭据泄露
          persist-credentials: false

      - name: 🖥️ 显示系统信息
        run: |
          # 1. 采集系统参数
          CPU_MODEL=$(grep 'model name' /proc/cpuinfo | head -1 | awk -F ': ' '{print $2}')
          CPU_FREQ=$(grep 'cpu MHz' /proc/cpuinfo | head -1 | awk -F ': ' '{print $2}')
          CPU_CORES=$(grep processor /proc/cpuinfo | wc -l)
          MEM_TOTAL=$(free -h | awk '/Mem:/ {print $2}')
          MEM_FREE=$(free -h | awk '/Mem:/ {print $4}')
          DISK_AVAIL=$(df -h / | awk 'NR==2 {print $4}')
          DISK_TOTAL=$(df -h / | awk 'NR==2 {print $2}')
          OS_NAME=$(lsb_release -d 2>/dev/null | awk -F ':' '{print $2}' | xargs || cat /etc/os-release | grep PRETTY_NAME | cut -d '=' -f 2 | tr -d '"')
          KERNEL_VER=$(uname -r)

          # 2. 打印现代化卡片式诊断看板
          echo -e "\n\e[1;36m=================================================================\e[0m"
          echo -e "\e[1;33m          🚀 运行环境与系统规格诊断报告 (SYSTEM DIAGNOSTICS)       \e[0m"
          echo -e "\e[1;36m=================================================================\e[0m"

          echo -e "\e[1;32m[💻 计算核心 (CPU)]\e[0m"
          echo -e "  • 处理器型号 : \e[1m${CPU_MODEL:-未知}\e[0m"
          echo -e "  • 核心与频率 : \e[1m${CPU_CORES} 线程 / 核心\e[0m (${CPU_FREQ:-未知} MHz)"

          echo -e "\n\e[1;32m[🧠 运行内存 (RAM)]\e[0m"
          echo -e "  • 总容量 / 可用: \e[1m${MEM_TOTAL}\e[0m / 🟢 \e[1m${MEM_FREE}\e[0m"

          echo -e "\n\e[1;32m[💾 根目录存储 (Storage)]\e[0m"
          echo -e "  • 可用 / 总计  : \e[1m${DISK_AVAIL}\e[0m / 📁 \e[1m${DISK_TOTAL}\e[0m"

          echo -e "\n\e[1;32m[🐧 操作系统与内核 (System & Kernel)]\e[0m"
          echo -e "  • 发行版本     : ${OS_NAME:-Ubuntu 24.04 LTS}"
          echo -e "  • Linux 内核   : \e[1m${KERNEL_VER}\e[0m"

          echo -e "\n\e[1;35m-----------------------------------------------------------------\e[0m"
          echo -e "\e[1;35m[📊 实时内存占用详情 (free -h)]\e[0m"
          free -h | sed 's/^/  │ /'

          echo -e "\n\e[1;35m[📊 存储设备详情 (df -Th)]\e[0m"
          df -Th / /mnt 2>/dev/null | awk '{print $1, $2, $3, $4, $5, $6}' | column -t | sed 's/^/  │ /'
          echo -e "\e[1;36m=================================================================\e[0m\n"

      - name: 🧹 可用磁盘空间
        run: |
          echo "::group::🧹 清理交换空间"
          sudo mkdir -p /home/runner/work/My-OpenWrt-Firmware/My-OpenWrt-Firmware
          sudo find /opt -mindepth 1 -maxdepth 1 ! -name "*runner*" -exec rm -rf {} \;
          sudo rm -rf /usr/local/lib/android \
          /usr/lib/google-cloud-sdk \
          /usr/lib/jvm \
          /usr/lib/{clang-16,clang-17,llvm-16,llvm-17} \
          /usr/local/aws* \
          /usr/local/julia* \
          /usr/local/share/{chromium,powershell,vcpkg} \
          /usr/share/dotnet \
          /usr/share/swift
          sudo swapoff -a
          sudo rm -f /swapfile

          echo "::group::  💽 创建交换"
          sudo dd if=/dev/zero of="/mnt/swapfile" bs=1G count=4
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          echo "::endgroup::"

          root_dev=$(df / | awk 'NR==2 {print $1}')
          mnt_dev=$(df /mnt | awk 'NR==2 {print $1}')
          if [[ "$root_dev" != "$mnt_dev" ]]; then
            echo "::group::  🧱 创建卷组"
            mnt_size=$(expr $(df -h /mnt | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//') - ${{ inputs.swap-size-gb }})
            root_size=$(expr $(df -h / | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//') - ${{ inputs.root-reserve-gb }})
            sudo truncate -s "$mnt_size"G /mnt/mnt.img
            sudo truncate -s "$root_size"G /root.img
            sudo losetup /dev/loop6 /mnt/mnt.img
            sudo losetup /dev/loop7 /root.img
            sudo pvcreate /dev/loop6
            sudo pvcreate /dev/loop7
            sudo vgcreate github /dev/loop6 /dev/loop7
            sudo lvcreate -n runner -l 100%FREE github
            sudo mkfs.xfs /dev/mapper/github-runner
            sudo mount /dev/mapper/github-runner /home/runner/work/My-OpenWrt-Firmware/My-OpenWrt-Firmware
            echo "::endgroup::"
          fi
          sudo chown -R runner:runner /home/runner/work/My-OpenWrt-Firmware/My-OpenWrt-Firmware
          sudo sysctl -w vm.drop_caches=3

      - name: 📊 修改后磁盘空间报告
        run: |
          echo -e "\n\e[1;32mMemory:\e[0m"
          sudo free -h
          echo -e "\e[1;32mAvailable Storage:\e[0m"
          sudo df -Th

      - name: 🛠️ 配置构建系统环境
        run: |
          echo "::group::📦 安装 OpenWrt 编译依赖"
          sudo rm -rf /etc/apt/sources.list.d
          sudo bash -c "curl -skL https://raw.githubusercontent.com/sbwml/actions/openwrt-build-setup/sources-24.04.list > /etc/apt/sources.list"
          sudo apt-get update
          sudo apt-get install -y \
            antlr3 asciidoc autoconf automake binutils \
            bison build-essential bzip2 ccache cmake \
            coreutils curl file flex g++ \
            g++-multilib gawk gcc-multilib gettext git \
            gnutls-dev gperf haveged jq lib32gcc-s1 \
            libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libncurses5-dev \
            libplist-utils libpython3-dev libreadline-dev libssl-dev libtool \
            msmtp patch python3 python3-pip python3-ply \
            python3-pyelftools qemu-utils rename rsync scons \
            subversion swig texinfo uglifyjs unzip \
            upx-ucl wget xmlto zlib1g-dev

          echo "::group::🐳 安装 Docker 环境"
          sudo mkdir -p /etc/apt/sources.list.d
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y \
            containerd.io docker-buildx-plugin docker-ce \
            docker-ce-cli docker-ce-rootless-extras docker-compose-plugin
          if [ -f /usr/libexec/docker/docker-init ]; then
            sudo ln -sf /usr/libexec/docker/docker-init /usr/local/bin/docker-init
          fi

          echo "::group::⚙️ 安装 LLVM/Clang 工具链"
          export PATH="/opt/clang/bin:$PATH"
          echo "/opt/clang/bin" >> $GITHUB_PATH
          sudo mkdir /opt/clang
          wget -q https://github.com/sbwml/openwrt-llvm-toolchain/releases/download/22.0.2/clang-22.0.2-x86_64-unknown-linux-gnu.tar.xz
          sudo tar --strip-components=1 -C /opt/clang -xf clang-*-x86_64-unknown-linux-gnu.tar.xz
          rm -rf clang-*-x86_64-unknown-linux-gnu.tar.xz
          clang --version
          sudo apt-get clean

      - name: ⬇️ 克隆 OpenWrt 源码
        run: |
          git clone --depth=1 -b openwrt-25.12 https://github.com/openwrt/openwrt.git
          sed -i 's|https://git.openwrt.org/feed/|https://github.com/openwrt/|g' openwrt/feeds.conf.default
          sed -i 's|https://git.openwrt.org/project/|https://github.com/openwrt/|g' openwrt/feeds.conf.default
          cd openwrt
          cp -f ../diy-part1.sh ./
          chmod +x ./diy-part1.sh && ./diy-part1.sh

      - name: 🔄 更新并安装 Feeds
        working-directory: ./openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp -f ../diy-part2.sh ./diy-part2.sh
          chmod +x ./diy-part2.sh && ./diy-part2.sh

      - name: 📂 加载补丁文件
        working-directory: ./openwrt
        run: |
          cp -rf $GITHUB_WORKSPACE/patches/BBRv3/* ./target/linux/generic/backport-6.12/
          cp -rf $GITHUB_WORKSPACE/patches/LRNG/* ./target/linux/generic/hack-6.12/   
          
      - name: ⚙️ 加载自定义配置
        working-directory: ./openwrt
        run: |
          cp $GITHUB_WORKSPACE/.config .config
          cp -rf $GITHUB_WORKSPACE/files ./
          make defconfig
          
      - name: 🗃️ 编译缓存
        uses: HiGarfield/cachewrtbuild@main
        with:
          mixkey: x86
          prefix: ${{ github.workspace }}/openwrt

      - name: 📚 下载软件包
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: 🔨 编译固件
        id: compile
        run: |
          cd openwrt
          echo "$(nproc) thread compile"
          make -j$(nproc) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
