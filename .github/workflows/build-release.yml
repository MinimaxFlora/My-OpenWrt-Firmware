name: Build Releases

on:
  workflow_dispatch:
  repository_dispatch:
    types: [upstream-update]

jobs:
  build:
    name: 🔨 编译 EternalWrt
    runs-on: ubuntu-24.04

    outputs:
      release_tag: ${{ steps.release_info.outputs.tag }}
      kmod_file: ${{ env.KMOD_PKG_NAME }}

    if: ${{ github.event.repository.owner.id == github.event.sender.id }}
    timeout-minutes: 360

    defaults:
      run:
        shell: bash

    permissions:
      contents: read
      actions: read

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: 🖥️ 显示系统信息
        run: |
          CPU_MODEL=$(grep 'model name' /proc/cpuinfo | head -1 | awk -F ': ' '{print $2}')
          CPU_FREQ=$(grep 'cpu MHz' /proc/cpuinfo | head -1 | awk -F ': ' '{print $2}')
          CPU_CORES=$(grep processor /proc/cpuinfo | wc -l)
          MEM_TOTAL=$(free -h | awk '/Mem:/ {print $2}')
          MEM_FREE=$(free -h | awk '/Mem:/ {print $4}')
          DISK_AVAIL=$(df -h / | awk 'NR==2 {print $4}')
          DISK_TOTAL=$(df -h / | awk 'NR==2 {print $2}')
          OS_NAME=$(lsb_release -d 2>/dev/null | awk -F ':' '{print $2}' | xargs || cat /etc/os-release | grep PRETTY_NAME | cut -d '=' -f 2 | tr -d '"')
          KERNEL_VER=$(uname -r)

          echo -e "\n\e[1;36m=================================================================\e[0m"
          echo -e "\e[1;33m         🚀 运行环境与系统规格诊断报告 (SYSTEM DIAGNOSTICS)\e[0m"
          echo -e "\e[1;36m=================================================================\e[0m"
          echo -e "\e[1;32m[💻 计算核心 (CPU)]\e[0m"
          echo -e "  • 处理器型号 : \e[1m${CPU_MODEL:-未知}\e[0m"
          echo -e "  • 核心与频率 : \e[1m${CPU_CORES} 线程 / 核心\e[0m (${CPU_FREQ:-未知} MHz)"
          echo -e "\n\e[1;32m[🧠 运行内存 (RAM)]\e[0m"
          echo -e "  • 总容量 / 可用: \e[1m${MEM_TOTAL}\e[0m / 🟢 \e[1m${MEM_FREE}\e[0m"
          echo -e "\n\e[1;32m[💾 根目录存储 (Storage)]\e[0m"
          echo -e "  • 可用 / 总计  : \e[1m${DISK_AVAIL}\e[0m / 📁 \e[1m${DISK_TOTAL}\e[0m"
          echo -e "\n\e[1;32m[🐧 操作系统与内核 (System & Kernel)]\e[0m"
          echo -e "  • 发行版本     : ${OS_NAME:-Ubuntu 24.04 LTS}"
          echo -e "  • Linux 内核   : \e[1m${KERNEL_VER}\e[0m"
          echo -e "\e[1;36m=================================================================\e[0m\n"

      - name: 🧹 可用磁盘空间
        run: |
          sudo mkdir -p /home/runner/work/My-OpenWrt-Firmware/My-OpenWrt-Firmware
          sudo find /opt -mindepth 1 -maxdepth 1 ! -name "*runner*" -exec rm -rf {} \;
          sudo rm -rf /usr/local/lib/android /usr/lib/google-cloud-sdk /usr/lib/jvm /usr/lib/{clang-16,clang-17,llvm-16,llvm-17} /usr/local/aws* /usr/local/julia* /usr/local/share/{chromium,powershell,vcpkg} /usr/share/dotnet /usr/share/swift
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of="/mnt/swapfile" bs=1G count=4
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          root_dev=$(df / | awk 'NR==2 {print $1}')
          mnt_dev=$(df /mnt | awk 'NR==2 {print $1}')
          if [[ "$root_dev" != "$mnt_dev" ]]; then
            mnt_size=$(expr $(df -h /mnt | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//') - 4)
            root_size=$(expr $(df -h / | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//') - 2)
            sudo truncate -s "$mnt_size"G /mnt/mnt.img
            sudo truncate -s "$root_size"G /root.img
            sudo losetup /dev/loop6 /mnt/mnt.img
            sudo losetup /dev/loop7 /root.img
            sudo pvcreate /dev/loop6
            sudo pvcreate /dev/loop7
            sudo vgcreate github /dev/loop6 /dev/loop7
            sudo lvcreate -n runner -l 100%FREE github
            sudo mkfs.xfs /dev/mapper/github-runner
            sudo mount /dev/mapper/github-runner /home/runner/work/My-OpenWrt-Firmware/My-OpenWrt-Firmware
          fi
          sudo chown -R runner:runner /home/runner/work/My-OpenWrt-Firmware/My-OpenWrt-Firmware
          sudo sysctl -w vm.drop_caches=3

      - name: 🛠️ 配置构建系统环境
        run: |
          sudo rm -rf /etc/apt/sources.list.d
          sudo bash -c "curl -skL https://raw.githubusercontent.com/sbwml/actions/openwrt-build-setup/sources-24.04.list > /etc/apt/sources.list"
          sudo apt-get update
          sudo apt-get install -y antlr3 asciidoc autoconf automake binutils bison build-essential bzip2 ccache cmake coreutils curl file flex g++ g++-multilib gawk gcc-multilib gettext git gnutls-dev gperf haveged jq lib32gcc-s1 libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libncurses5-dev libplist-utils libpython3-dev libreadline-dev libssl-dev libtool msmtp patch python3 python3-pip python3-ply python3-pyelftools qemu-utils rename rsync scons subversion swig texinfo uglifyjs unzip upx-ucl wget xmlto zlib1g-dev

      - name: ⬇️ 克隆 OpenWrt 源码
        run: |
          git clone --depth=1 -b openwrt-25.12 https://github.com/openwrt/openwrt.git
          sed -i 's|https://git.openwrt.org/feed/|https://github.com/openwrt/|g' openwrt/feeds.conf.default
          sed -i 's|https://git.openwrt.org/project/|https://github.com/openwrt/|g' openwrt/feeds.conf.default
          cd openwrt
          cp -f ../diy-part1.sh ./
          chmod +x ./diy-part1.sh
          ./diy-part1.sh

      - name: 🔄 更新并安装 Feeds
        working-directory: ./openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp -f ../diy-part2.sh ./diy-part2.sh
          chmod +x ./diy-part2.sh
          ./diy-part2.sh

      - name: 📂 加载补丁文件
        working-directory: ./openwrt
        run: |
          cp -rf "$GITHUB_WORKSPACE/scripts/"* ./
          cp -rf "$GITHUB_WORKSPACE/patches/IGC/996-intel-igc-i225-i226-disable-eee.patch" ./target/linux/x86/patches-6.12/
          cp -rf "$GITHUB_WORKSPACE/patches/BBRv3/"* ./target/linux/generic/backport-6.12/
          cp -rf "$GITHUB_WORKSPACE/patches/LRNG/"* ./target/linux/generic/hack-6.12/

      - name: ⚙️ 加载自定义配置
        working-directory: ./openwrt
        run: |
          cp "$GITHUB_WORKSPACE/.config" .config
          cp -rf "$GITHUB_WORKSPACE/files" ./
          make defconfig

      - name: 🗃️ 编译缓存
        uses: HiGarfield/cachewrtbuild@main
        with:
          mixkey: x86
          prefix: ${{ github.workspace }}/openwrt

      - name: 📚 下载软件包
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: 🔨 编译固件
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: 📝 生成内核和 OTA 索引
        run: |          
          cd openwrt
          cp -f ../diy-part3.sh ./diy-part3.sh
          chmod +x ./diy-part3.sh
          ./diy-part3.sh          

      - name: 📦 整理固件与生成 Release 说明
        id: release_info
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages

          FIRMWARE_DIR="${GITHUB_WORKSPACE}/firmware_out"
          mkdir -p "$FIRMWARE_DIR"

          RELEASE_TAG="EternalWrt_$(date +'%Y.%m.%d-%H%M%S')"
          BUILD_DATE=$(date +"%Y-%m-%d %H:%M:%S")

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

          FIRMWARE_FILES=(
            "openwrt-x86-64-generic-ext4-combined.img.gz"
            "openwrt-x86-64-generic-ext4-combined-efi.img.gz"
            "openwrt-x86-64-generic-squashfs-combined.img.gz"
            "openwrt-x86-64-generic-squashfs-combined-efi.img.gz"
          ]

          for file in "${FIRMWARE_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ 固件文件不存在: $file"
              exit 1
            fi
          done

          sha256sum "${FIRMWARE_FILES[@]}" > sha256sums.txt

          cat <<EOF > release_notes.md
          # 🚀 EternalWrt 固件发布报告

          | 配置项目 | 详细信息 |
          | :--- | :--- |
          | 🕒 **编译时间** | \`${BUILD_DATE}\` |
          | 🏷️ **发布标签** | \`${RELEASE_TAG}\` |
          | 💻 **目标平台** | \`x86-64 Generic\` |
          | ⚡ **默认 IP** | \`192.168.1.1\` |
          | 🔑 **默认密码** | \`none (无密码)\` |

          ### 📦 固件列表

          | 固件 | 类型 |
          | :--- | :--- |
          | \`openwrt-x86-64-generic-ext4-combined.img.gz\` | EXT4 / BIOS |
          | \`openwrt-x86-64-generic-ext4-combined-efi.img.gz\` | EXT4 / EFI |
          | \`openwrt-x86-64-generic-squashfs-combined.img.gz\` | SquashFS / BIOS |
          | \`openwrt-x86-64-generic-squashfs-combined-efi.img.gz\` | SquashFS / EFI |

          ### 🔐 SHA256 校验码

          \`\`\`text
          $(cat sha256sums.txt)
          \`\`\`

          > 💡 **提示**：建议刷机前核对文件 SHA256 校验码，确保固件传输完整无损。
          EOF

          # 复制主固件、校验和、说明文件以及生成的 ota.json 与 kmod 压缩包到输出目录
          cp "${FIRMWARE_FILES[@]}" "$FIRMWARE_DIR/"
          cp sha256sums.txt "$FIRMWARE_DIR/"
          cp release_notes.md "$FIRMWARE_DIR/"
          
          if [ -f "${GITHUB_WORKSPACE}/ota.json" ]; then
            cp "${GITHUB_WORKSPACE}/ota.json" "$FIRMWARE_DIR/"
          fi
          
          if [ -n "$KMOD_PKG_NAME" ] && [ -f "${GITHUB_WORKSPACE}/${KMOD_PKG_NAME}.tar.gz" ]; then
            cp "${GITHUB_WORKSPACE}/${KMOD_PKG_NAME}.tar.gz" "$FIRMWARE_DIR/"
          fi

      - name: 📤 上传固件 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: EternalWrt_Firmware
          path: ./firmware_out/*

  release:
    name: 🚀 发布 GitHub Release
    needs: build
    runs-on: ubuntu-24.04

    permissions:
      contents: write
      actions: read

    if: needs.build.result == 'success'

    steps:
      - name: 📥 下载固件 Artifact
        uses: actions/download-artifact@v8
        with:
          name: EternalWrt_Firmware
          path: ./firmware

      - name: 🚀 发布固件到主 Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: ${{ needs.build.outputs.release_tag }}
          body_path: ./firmware/release_notes.md
          files: |
            ./firmware/openwrt-x86-64-generic-ext4-combined.img.gz
            ./firmware/openwrt-x86-64-generic-ext4-combined-efi.img.gz
            ./firmware/openwrt-x86-64-generic-squashfs-combined.img.gz
            ./firmware/openwrt-x86-64-generic-squashfs-combined-efi.img.gz
            ./firmware/sha256sums.txt
            ./firmware/ota.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 上传 kmod 依赖包到固定 Tag
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: kmod-openwrt-25.12
          name: OpenWrt 25.12 Kernel Modules (kmod)
          body: "自动同步的内核 kmod 依赖包，用于对应版本的软件包安装。"
          files: ./firmware/*.tar.gz
          allow_upload_to_existing_tag: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
